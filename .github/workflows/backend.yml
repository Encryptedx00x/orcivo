name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: pnpm turbo run lint --filter=@orcivo/backend

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@orcivo/backend

      - name: Build
        run: pnpm turbo run build --filter=@orcivo/backend

  test:
    name: Test (with Postgres + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orcivo
          POSTGRES_PASSWORD: orcivo
          POSTGRES_DB: orcivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_TEST: postgresql://orcivo:orcivo@localhost:5432/orcivo_test
      DATABASE_URL: postgresql://orcivo:orcivo@localhost:5432/orcivo_test
      JWT_ACCESS_SECRET: ci-access-secret-test
      JWT_REFRESH_SECRET: ci-refresh-secret-test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: orcivo-test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: .

      - name: Push schema to test database
        run: DATABASE_URL=$DATABASE_URL_TEST npx prisma db push --force-reset
        working-directory: .

      - name: Run backend tests (including tenant isolation)
        run: pnpm --filter @orcivo/backend test:ci
