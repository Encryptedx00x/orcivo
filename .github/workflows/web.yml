name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=@orcivo/web --filter=@orcivo/site

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@orcivo/web --filter=@orcivo/site

      - name: Verify logout revocation behavior
        run: node --test apps/web/app/api/auth/logout/route.test.cjs

      - name: Build
        run: pnpm turbo run build --filter=@orcivo/web --filter=@orcivo/site
