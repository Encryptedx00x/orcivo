<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Orcivo — Lote A · Auth & Onboarding</title>
<link rel="icon" href="../assets/mark.svg">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="auth.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #f0eee9; }
  /* When embedded inside an Android frame, the body bg leaks behind via the
   * frame's flex column — kill it locally inside each artboard. */
  .auth-m, .aw-shell { background: #fff; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root" data-screen-label="Lote A — Auth & Onboarding"></div>

<script type="text/babel" src="../design-canvas.jsx"></script>
<script type="text/babel" src="../android-frame.jsx"></script>
<script type="text/babel" src="AuthIcons.jsx"></script>
<script type="text/babel" src="AuthMobile.jsx"></script>
<script type="text/babel" src="AuthWeb.jsx"></script>

<script type="text/babel">
  // Wrap a mobile screen in a borderless Android device (no app bar, since
  // auth screens have their own custom headers).
  function Phone({ children }) {
    return (
      <AndroidDevice width={392} height={812} dark={false}>
        {children}
      </AndroidDevice>
    );
  }

  function Root() {
    return (
      <DesignCanvas>
        <DCSection
          id="mobile-auth"
          title="Mobile · Auth & Onboarding"
          subtitle="Android · 392×812 · cinco fluxos consecutivos">
          <DCArtboard id="m-login"      label="01 · Login"               width={392} height={812}><Phone><MobLogin/></Phone></DCArtboard>
          <DCArtboard id="m-signup"     label="02 · Cadastro"            width={392} height={812}><Phone><MobSignup/></Phone></DCArtboard>
          <DCArtboard id="m-forgot"     label="03 · Esqueci senha"       width={392} height={812}><Phone><MobForgot/></Phone></DCArtboard>
          <DCArtboard id="m-forgot-ok"  label="03b · Email enviado"      width={392} height={812}><Phone><MobForgotSent/></Phone></DCArtboard>
          <DCArtboard id="m-select"     label="04 · Selecionar empresa"  width={392} height={812}><Phone><MobSelectCompany/></Phone></DCArtboard>
          <DCArtboard id="m-create"     label="05 · Criar empresa"       width={392} height={812}><Phone><MobCreateCompany/></Phone></DCArtboard>
        </DCSection>

        <DCSection
          id="web-auth"
          title="Web · Auth & Onboarding"
          subtitle="Desktop · 1280×800 · split layout dark à esquerda, formulário à direita">
          <DCArtboard id="w-login"  label="01 · Login"          width={1280} height={800}><WebLogin/></DCArtboard>
          <DCArtboard id="w-signup" label="02 · Cadastro"       width={1280} height={800}><WebSignup/></DCArtboard>
          <DCArtboard id="w-create" label="03 · Criar empresa"  width={1280} height={800}><WebCreateCompany/></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
