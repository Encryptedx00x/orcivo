<!doctype html><html><head><meta charset="utf-8"><title>Type families</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { border: 1px solid var(--border-1); border-radius: 12px; padding: 16px; }
  .label { font: 500 11px/14px var(--font-mono); color: var(--fg-3); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 8px; }
  .big { font-size: 32px; line-height: 1.1; }
  .row { display: flex; gap: 12px; align-items: baseline; color: var(--fg-2); font-size: 13px; margin-top: 6px; }
  .w { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 36px; }
  .money { font-feature-settings: "tnum"; font-weight: 600; font-size: 22px; }
</style></head><body>
  <div class="card">
    <div class="label">Inter · Sans</div>
    <div class="big" style="font-weight:700">Aa Bb Cc 123</div>
    <div class="row"><span class="w">400</span><span style="font-weight:400">Orçamento profissional</span></div>
    <div class="row"><span class="w">500</span><span style="font-weight:500">Orçamento profissional</span></div>
    <div class="row"><span class="w">600</span><span style="font-weight:600">Orçamento profissional</span></div>
    <div class="row"><span class="w">700</span><span style="font-weight:700">Orçamento profissional</span></div>
  </div>
  <div class="card">
    <div class="label">JetBrains Mono · Numerals & code</div>
    <div class="big money" style="font-family:var(--font-mono)">R$ 12.480,00</div>
    <div class="row" style="font-family:var(--font-mono); color:var(--slate-800)"><span class="w">code</span><span>const total = "1248.00";</span></div>
    <div class="row" style="font-family:var(--font-mono)"><span class="w">tnum</span><span>0123456789</span></div>
    <div class="row"><span class="w">use</span><span>Tabular nums for money + table cells.</span></div>
  </div>
</body></html>
