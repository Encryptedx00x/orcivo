<!doctype html><html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .cell { text-align: center; }
  .box  { height: 84px; background: var(--purple-50); border: 1px solid var(--purple-200); }
  .lab  { margin-top: 8px; font: 600 12px var(--font-sans); color: var(--ink); }
  .px   { font: 500 11px var(--font-mono); color: var(--fg-3); }
</style></head><body>
  <div class="cell"><div class="box" style="border-radius:8px"></div><div class="lab">sm</div><div class="px">8 · inputs</div></div>
  <div class="cell"><div class="box" style="border-radius:12px"></div><div class="lab">md</div><div class="px">12 · cards</div></div>
  <div class="cell"><div class="box" style="border-radius:16px"></div><div class="lab">lg</div><div class="px">16</div></div>
  <div class="cell"><div class="box" style="border-radius:20px"></div><div class="lab">xl</div><div class="px">20 · modals</div></div>
  <div class="cell"><div class="box" style="border-radius:24px 24px 0 0"></div><div class="lab">2xl</div><div class="px">24 · sheets</div></div>
  <div class="cell"><div class="box" style="border-radius:9999px"></div><div class="lab">pill</div><div class="px">badges</div></div>
</body></html>
