<!doctype html><html><head><meta charset="utf-8"><title>Money + numbers</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
  .cell { border: 1px solid var(--border-1); border-radius: 12px; padding: 14px 16px; background: #fff; }
  .lab { font: 500 11px var(--font-mono); color: var(--fg-3); text-transform: uppercase; letter-spacing:.06em; }
  .val { font: 600 28px var(--font-sans); color: var(--ink); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .sub { font: 400 13px var(--font-sans); color: var(--fg-3); margin-top: 4px; }
  .green { color: var(--success); }
  .red   { color: var(--danger); }
</style></head><body>
  <div class="cell"><div class="lab">Recebido no mês</div><div class="val green">R$ 12.480,00</div><div class="sub">17 recebimentos</div></div>
  <div class="cell"><div class="lab">Pendente</div><div class="val">R$ 3.250,00</div><div class="sub">5 em aberto · 1 vence amanhã</div></div>
  <div class="cell"><div class="lab">Vencido</div><div class="val red">R$ 880,00</div><div class="sub">2 recebimentos</div></div>
</body></html>
