<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px 24px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 7px 0; }
  .name { width: 64px; font: 600 13px var(--font-sans); color: var(--ink); }
  .px   { width: 56px; font: 500 12px var(--font-mono); color: var(--fg-3); }
  .bar  { height: 16px; background: var(--purple-600); border-radius: 4px; }
</style></head><body>
  <div class="row"><div class="name">xs</div><div class="px">4 px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="name">sm</div><div class="px">8 px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="name">md</div><div class="px">12 px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="name">lg</div><div class="px">16 px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="name">xl</div><div class="px">24 px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="name">2xl</div><div class="px">32 px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="name">3xl</div><div class="px">48 px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="name">4xl</div><div class="px">64 px</div><div class="bar" style="width:64px"></div></div>
</body></html>
