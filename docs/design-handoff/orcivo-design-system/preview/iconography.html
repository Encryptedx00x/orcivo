<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 18px 22px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 10px; }
  .cell svg { color: var(--slate-700); }
  .lab { font: 500 10px var(--font-mono); color: var(--fg-3); }
  .note { margin-top: 14px; font: 400 12px var(--font-sans); color: var(--fg-3); border-top: 1px solid var(--border-2); padding-top: 10px; }
  .note b { color: var(--ink); font-weight: 600; }
</style></head><body>
