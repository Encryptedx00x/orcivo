<!doctype html><html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: 10px; overflow: hidden; border: 1px solid var(--border-1); }
  .sw .chip { height: 64px; }
  .sw .meta { padding: 8px 10px; background: #fff; }
  .sw .name { font-size: 12px; font-weight: 600; color: var(--ink); }
  .sw .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body>
<div class="row" id="r"></div>
<script>
  const stops = [
    ['50','#F5F3FF'],['100','#EDE9FE'],['200','#DDD6FE'],['300','#C4B5FD'],['400','#A78BFA'],['500','#8B5CF6'],
    ['600','#6D28D9'],['700','#5B21B6'],['800','#4C1D95'],['900','#3B0A6E'],['Ink','#0A0A0F'],['White','#FFFFFF']
  ];
  document.getElementById('r').innerHTML = stops.map(([n,h])=>`
    <div class="sw"><div class="chip" style="background:${h}"></div>
    <div class="meta"><div class="name">${n.match(/^\d/)?'Purple '+n:n}</div><div class="hex">${h}</div></div></div>
  `).join('');
</script>
</body></html>
