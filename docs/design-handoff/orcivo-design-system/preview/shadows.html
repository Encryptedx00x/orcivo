<!doctype html><html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px; background: var(--slate-50); display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .cell { text-align: center; }
  .box  { height: 96px; background: #fff; border-radius: 12px; }
  .b1 { box-shadow: var(--shadow-card); }
  .b2 { box-shadow: var(--shadow-pop); }
  .b3 { box-shadow: var(--shadow-modal); }
  .lab { margin-top: 10px; font: 600 13px var(--font-sans); color: var(--ink); }
  .px  { font: 500 11px var(--font-mono); color: var(--fg-3); }
</style></head><body>
  <div class="cell"><div class="box b1"></div><div class="lab">shadow-card</div><div class="px">0 1 3 / .08 · hover, FAB</div></div>
  <div class="cell"><div class="box b2"></div><div class="lab">shadow-pop</div><div class="px">0 4 12 / .10 · menus</div></div>
  <div class="cell"><div class="box b3"></div><div class="lab">shadow-modal</div><div class="px">0 20 40 / .18 · modals</div></div>
</body></html>
