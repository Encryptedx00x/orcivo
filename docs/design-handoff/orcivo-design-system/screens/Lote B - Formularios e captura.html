<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Orcivo — Lote B · Formulários e captura</title>
<link rel="icon" href="../assets/mark.svg">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="forms.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #f0eee9; }
  .auth-m, .app-shell { background: var(--slate-50); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root" data-screen-label="Lote B — Formulários e captura"></div>

<script type="text/babel" src="../design-canvas.jsx"></script>
<script type="text/babel" src="../android-frame.jsx"></script>
<script type="text/babel" src="AuthIcons.jsx"></script>
<script type="text/babel" src="FormsMobile.jsx"></script>
<script type="text/babel" src="FormsWeb.jsx"></script>

<script type="text/babel">
  function Phone({ children }) {
    return (
      <AndroidDevice width={392} height={812} dark={false}>
        {children}
      </AndroidDevice>
    );
  }
  // Landscape phone for signature collection
  function PhoneLandscape({ children }) {
    return (
      <AndroidDevice width={812} height={392} dark={true}>
        {children}
      </AndroidDevice>
    );
  }
  function WebFrame({ children }) {
    return (
      <div style={{width:"100%", height:"100%", borderRadius:14, overflow:"hidden", border:"1px solid #e5e2dd", background:"var(--slate-50)"}}>
        {children}
      </div>
    );
  }

  function Root() {
    return (
      <DesignCanvas>
        <DCSection
          id="mobile-forms"
          title="Mobile · Formulários e captura"
          subtitle="Novo cliente · novo item de catálogo · assinatura (landscape) · fotos da OS">
          <DCArtboard id="m-new-cust" label="01 · Novo cliente"     width={392} height={812}><Phone><MobNewCustomer/></Phone></DCArtboard>
          <DCArtboard id="m-new-cat"  label="02 · Novo item de catálogo" width={392} height={812}><Phone><MobNewCatalogItem/></Phone></DCArtboard>
          <DCArtboard id="m-sig"      label="03 · Assinatura · landscape" width={812} height={392}><PhoneLandscape><MobSignature/></PhoneLandscape></DCArtboard>
          <DCArtboard id="m-photos"   label="04 · Fotos da OS"      width={392} height={812}><Phone><MobOSPhotos/></Phone></DCArtboard>
        </DCSection>

        <DCSection
          id="web-forms"
          title="Web · Formulários"
          subtitle="Novo cliente (full page) · Cliente detalhe com 6 abas">
          <DCArtboard id="w-new-cust" label="01 · Novo cliente"  width={1280} height={920}><WebFrame><WebNewCustomer/></WebFrame></DCArtboard>
          <DCArtboard id="w-cust"     label="02 · Cliente detalhe · 6 abas" width={1280} height={1220}><WebFrame><WebCustomerDetail/></WebFrame></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
