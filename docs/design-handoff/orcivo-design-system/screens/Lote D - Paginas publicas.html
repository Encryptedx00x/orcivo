<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Orcivo — Lote D · Páginas públicas</title>
<link rel="icon" href="../assets/mark.svg">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="public.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #f0eee9; }
  /* mobile badge utilities used inside public pages */
  .m-badge { font: 600 11px/1 var(--font-sans); padding: 4px 8px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 5px; }
  .m-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .b-warn { background: #FEF3C7; color: #92400E; }
  .b-ok   { background: #DCFCE7; color: #166534; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root" data-screen-label="Lote D — Páginas públicas"></div>

<script type="text/babel" src="../design-canvas.jsx"></script>
<script type="text/babel" src="../android-frame.jsx"></script>
<script type="text/babel" src="AuthIcons.jsx"></script>
<script type="text/babel" src="Public.jsx"></script>

<script type="text/babel">
  function Phone({ children }) {
    return (
      <AndroidDevice width={392} height={840} dark={false}>
        {children}
      </AndroidDevice>
    );
  }
  function WebFrame({ children, h }) {
    return (
      <div style={{width:"100%", height:"100%", borderRadius:14, overflow:"hidden", border:"1px solid #e5e2dd", background:"#fff"}}>
        {/* fake browser chrome */}
        <div style={{height:36, background:"#f1f5f9", borderBottom:"1px solid #e2e8f0", display:"flex", alignItems:"center", padding:"0 12px", gap:8}}>
          <div style={{display:"flex", gap:6}}>
            <div style={{width:10, height:10, borderRadius:"50%", background:"#fb7185"}}/>
            <div style={{width:10, height:10, borderRadius:"50%", background:"#fbbf24"}}/>
            <div style={{width:10, height:10, borderRadius:"50%", background:"#34d399"}}/>
          </div>
          <div style={{flex:1, maxWidth:380, height:22, borderRadius:6, background:"#fff", border:"1px solid #e2e8f0", display:"flex", alignItems:"center", padding:"0 10px", fontSize:11, color:"#64748b", fontFamily:"var(--font-mono)"}}>
            🔒 orcivo.app/q/abc-248-vila-nova
          </div>
        </div>
        <div style={{height:"calc(100% - 36px)"}}>{children}</div>
      </div>
    );
  }

  function Root() {
    return (
      <DesignCanvas>
        <DCSection
          id="public-quote"
          title="Aprovação pública de orçamento"
          subtitle="Link único acessado pelo cliente · responsivo desktop ↔ mobile">
          <DCArtboard id="d-pub-web"     label="01 · Desktop · aguardando resposta" width={1120} height={1200}><WebFrame><WebPublicQuote/></WebFrame></DCArtboard>
          <DCArtboard id="d-pub-mob"     label="02 · Mobile · mesma URL"            width={392}  height={840}><Phone><MobPublicQuote/></Phone></DCArtboard>
          <DCArtboard id="d-pub-success" label="03 · Pós-aprovação · Pix"            width={1120} height={760}><WebFrame><WebPublicQuoteApproved/></WebFrame></DCArtboard>
        </DCSection>

        <DCSection
          id="pdf-preview"
          title="Preview de PDF"
          subtitle="Visualização do PDF antes de enviar · 2 páginas A4 · marca + Pix + assinatura">
          <DCArtboard id="d-pdf" label="01 · PDF · 2 páginas + side panel" width={1280} height={1100}><WebFrame><WebPDFPreview/></WebFrame></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
