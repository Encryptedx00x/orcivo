# docker-compose.yml — Stack core Orcivo (Fase 0)
# Serviços: PostgreSQL 16, Redis 7, MinIO, Caddy
# Executar na VPS em /opt/orcivo/
# Requires: infra/.env (nunca commitado — use .env.example como base)

services:

  postgres:
    image: postgres:16-alpine
    container_name: orcivo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orcivo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orcivo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - orcivo_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: orcivo_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - orcivo_internal
      - orcivo_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: orcivo_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - orcivo_internal
      - orcivo_public
    depends_on:
      - minio

networks:
  orcivo_internal:
    driver: bridge
    internal: true
  orcivo_public:
    driver: bridge

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/redis
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/minio
  caddy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/caddy/data
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/caddy/config
