services:
  postgres:
    image: postgres:16-alpine
    container_name: orcivo_postgres_dev
    environment:
      POSTGRES_USER: orcivo
      POSTGRES_PASSWORD: orcivo
      POSTGRES_DB: orcivo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcivo -d orcivo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orcivo_redis_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
